<!DOCTYPE html>
<html>
<head>
    <title>Traffic Dashboard</title>
</head>
<body>
    <h1>Adaptive Traffic Light Control</h1>
    <img src="data:image/png;base64,{{ chart }}" />

            <li>{{ k }} : {{ v }} seconds</li>
        {% endfor %}
    </ul>
</body>
</html>
